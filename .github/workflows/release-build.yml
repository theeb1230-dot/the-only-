name: The Only Release Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/release-build.yml'
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --org com.theonly --project-name the_only .
      - name: Build Android Mobile APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../The-Only-Android-Mobile.apk
      - name: Configure Android TV manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<application'
          features = '''    <uses-feature android:name="android.software.leanback" android:required="true" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n'''
          if 'android.software.leanback' not in s:
              s = s.replace(marker, features + marker, 1)
          launcher = '<category android:name="android.intent.category.LAUNCHER"/>'
          leanback = launcher + '\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>'
          if 'android.intent.category.LEANBACK_LAUNCHER' not in s:
              if launcher not in s:
                  raise SystemExit('Launcher category not found; refusing unsafe TV manifest mutation')
              s = s.replace(launcher, leanback, 1)
          p.write_text(s)
          PY
          grep -q 'android.software.leanback' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.touchscreen.*false' android/app/src/main/AndroidManifest.xml
      - name: Build Android TV APK
        run: |
          flutter build apk --release --dart-define=THE_ONLY_DEVICE=tv
          cp build/app/outputs/flutter-apk/app-release.apk ../The-Only-Android-TV.apk
      - name: Verify distinct Android products
        run: |
          test -s ../The-Only-Android-Mobile.apk
          test -s ../The-Only-Android-TV.apk
          MOBILE_SHA="$(sha256sum ../The-Only-Android-Mobile.apk | cut -d' ' -f1)"
          TV_SHA="$(sha256sum ../The-Only-Android-TV.apk | cut -d' ' -f1)"
          test "$MOBILE_SHA" != "$TV_SHA"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump xmltree ../The-Only-Android-TV.apk AndroidManifest.xml | grep -q 'android.software.leanback'
          "$AAPT" dump xmltree ../The-Only-Android-TV.apk AndroidManifest.xml | grep -q 'android.intent.category.LEANBACK_LAUNCHER'
          "$AAPT" dump xmltree ../The-Only-Android-TV.apk AndroidManifest.xml | grep -q 'android.hardware.touchscreen'
      - uses: actions/upload-artifact@v4
        with:
          name: the-only-android
          path: |
            The-Only-Android-Mobile.apk
            The-Only-Android-TV.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate missing iOS platform scaffold
        run: flutter create --platforms=ios --org com.theonly --project-name the_only .
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/TheOnly.app
          zip -qry ../The-Only-iOS-UNSIGNED.ipa Payload
          unzip -l ../The-Only-iOS-UNSIGNED.ipa | grep 'Payload/TheOnly.app/'
      - uses: actions/upload-artifact@v4
        with:
          name: the-only-ios-unsigned
          path: The-Only-iOS-UNSIGNED.ipa
          if-no-files-found: error

  provenance:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: the-only-*
          merge-multiple: true
          path: release
      - name: Generate checksums and provenance
        run: |
          cd release
          test -s The-Only-Android-Mobile.apk
          test -s The-Only-Android-TV.apk
          test -s The-Only-iOS-UNSIGNED.ipa
          unzip -l The-Only-iOS-UNSIGNED.ipa | grep 'Payload/TheOnly.app/'
          MOBILE_SHA="$(sha256sum The-Only-Android-Mobile.apk | cut -d' ' -f1)"
          TV_SHA="$(sha256sum The-Only-Android-TV.apk | cut -d' ' -f1)"
          test "$MOBILE_SHA" != "$TV_SHA"
          sha256sum The-Only-Android-Mobile.apk The-Only-Android-TV.apk The-Only-iOS-UNSIGNED.ipa > SHA256SUMS
          {
            echo "THE ONLY BUILD PROVENANCE"
            echo "commit=${GITHUB_SHA}"
            echo "version=0.1.0+1"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "android_mobile_sha256=${MOBILE_SHA}"
            echo "android_tv_sha256=${TV_SHA}"
            echo "android_tv_profile=LEANBACK_LAUNCHER; leanback required; touchscreen not required"
            echo "android_signing=debug signing configuration; not production signed"
            echo "ios_signing=UNSIGNED/no-codesign"
            echo "ios_installability=requires signing before normal device installation"
          } > BUILD_PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: the-only-release-bundle
          path: release
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: the-only-release-bundle
          path: release
      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/The-Only-Android-Mobile.apk release/The-Only-Android-TV.apk release/The-Only-iOS-UNSIGNED.ipa release/SHA256SUMS release/BUILD_PROVENANCE.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "The Only 0.1.0+1" --notes "Distinct Android Mobile + Android TV (LEANBACK) + iOS UNSIGNED/no-codesign built from exact commit $GITHUB_SHA. The iOS IPA requires signing before normal device installation. Android artifacts use the repository's documented debug signing configuration, not production signing."
