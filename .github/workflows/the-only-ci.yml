name: The Only CI

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/the-only-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/the-only-ci.yml'

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
