name: The Only LIVE Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/live_verify.sh'
      - '.github/workflows/live-verification.yml'
      - 'app/lib/core/providers/legal_demo_provider.dart'
      - 'app/lib/core/providers/legal_live_demo_provider.dart'

permissions:
  contents: read

jobs:
  legal-public-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved public sample media over HTTPS
        run: bash tools/live_verify.sh
