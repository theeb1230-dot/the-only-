name: Archive Inside4ndroid repositories

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-inside4ndroid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    if: ${{ !contains(github.event.head_commit.message || '', '[archive-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and compress all public repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archives/Inside4ndroid
          repos=(
            'M3U-XCAPI-EPG-IPTV-Stremio:main'
            'TMDB-Embed-API:main'
            'Cinema-HQ:main'
            'aa-torque-ex:master'
            'porn-api-js:main'
            'Inside4ndroid:main'
            'XStat-Hardware-Monitoring:main'
            'DeskEngine:main'
            'PyEmbed-Api:master'
            'Rainity26-Unity-Project:main'
            'Electron-ADB-ToolKit:main'
            'chxbio_v2:main'
            'ResolveURL:master'
            'Rainity26-DesktopApplication-API:main'
          )
          : > archives/Inside4ndroid/MANIFEST.tsv
          printf 'repository\tbranch\thead_sha\tarchive\tsha256\n' >> archives/Inside4ndroid/MANIFEST.tsv
          for item in "${repos[@]}"; do
            repo="${item%%:*}"
            branch="${item##*:}"
            echo "Archiving Inside4ndroid/$repo ($branch)"
            sha="$(git ls-remote "https://github.com/Inside4ndroid/$repo.git" "refs/heads/$branch" | awk '{print $1}')"
            tmp="$(mktemp -d)"
            curl -fL --retry 3 --retry-delay 2 "https://codeload.github.com/Inside4ndroid/$repo/zip/$sha" -o "$tmp/$repo.zip"
            size="$(stat -c%s "$tmp/$repo.zip")"
            if [ "$size" -le 90000000 ]; then
              dest="archives/Inside4ndroid/$repo.zip"
              mv "$tmp/$repo.zip" "$dest"
              digest="$(sha256sum "$dest" | awk '{print $1}')"
              printf '%s\t%s\t%s\t%s\t%s\n' "$repo" "$branch" "$sha" "$repo.zip" "$digest" >> archives/Inside4ndroid/MANIFEST.tsv
            else
              mkdir -p "archives/Inside4ndroid/$repo.parts"
              split -b 90M -d -a 3 "$tmp/$repo.zip" "archives/Inside4ndroid/$repo.parts/$repo.zip.part-"
              digest="$(sha256sum "$tmp/$repo.zip" | awk '{print $1}')"
              printf '%s\t%s\t%s\t%s\t%s\n' "$repo" "$branch" "$sha" "$repo.parts/ (split archive)" "$digest" >> archives/Inside4ndroid/MANIFEST.tsv
            fi
            rm -rf "$tmp"
          done

      - name: Commit archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archives/Inside4ndroid
          git commit -m 'Archive all Inside4ndroid repositories [archive-sync]' || exit 0
          git push origin HEAD:main
